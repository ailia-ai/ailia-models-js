<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaceMesh-V2 | ailia.js Demo</title>
    <link rel="stylesheet" href="../style.css" />

    <script type='module'>
        import { Ailia } from '../ailia-js/ailia.js';
        import { computeFacemesh, plotFacemesh } from './facemeshUtils.js';
        import { delay, setStatus, changeSampleImage, createAiliaWithModel, setupSampleImageRunButton, setupVideoStreamRunButton } from '../common/demoUtils.js';

        // The face in the shared sample image covers about an eighth of the frame,
        // which is too small for the short range detector to localize well. For the
        // still image, search the right half from a quarter down at half size, which
        // is where the face sits. Landmarks are mapped back onto the full picture, so
        // the result is still drawn over the original image. The camera keeps the
        // whole frame, where the face is normally close enough already.
        const SAMPLE_IMAGE_SEARCH_REGION = { x: 0.5, y: 0.25, width: 0.5, height: 0.5 };

        if (document.readyState === 'complete') { // Safari
            onload();
        }else{ // Chrome or Safari
            window.addEventListener('load', onload);
        }

        async function onload(){
            const imageContainerElement = document.querySelector('.sample-image');
            imageContainerElement.addEventListener('click', changeSampleImage.bind(null, imageContainerElement));

            await Ailia.initialize();
            const [ailiaDetector, ailiaLandmarks] = await Promise.all([
                createAiliaWithModel('face_detector'),
                createAiliaWithModel('face_landmarks_detector'),
            ]);

            if (ailiaDetector === null || ailiaLandmarks === null) {
                setStatus('Could not load the model files from the backend', 'error');
                return;
            }

            document.body.classList.add('model-loaded');
            setStatus('Model ready to run');

            const myresult = document.querySelector('.result-json');

            async function processImage(imageElement, outputOverlayCanvas, searchRegion) {
                try {
                    await delay(1);
                    var startTime = new Date();
                    const faces = computeFacemesh(ailiaDetector, ailiaLandmarks, imageElement, searchRegion);
                    var endTime = new Date();
                    setStatus('The model has finished running ' + (endTime.getTime() - startTime.getTime()) + 'ms');

                    plotFacemesh(outputOverlayCanvas, faces);

                    if (faces && faces.length > 0) {
                        // 478 landmarks per face is far too much to read, so show a summary
                        myresult.innerText = JSON.stringify(faces.map(face => ({
                            score: face.score,
                            landmarkCount: face.landmarks.length,
                            firstLandmark: face.landmarks[0]
                        })), null, 4);
                    } else {
                        myresult.innerText = '';
                    }
                } catch (e) {
                    const message = `${ailiaDetector.getErrorDetail()}${ailiaLandmarks.getErrorDetail()}`;
                    console.log(e);
                    console.error(message);
                    setStatus(`Error while running the model: ${message}`, 'error');
                }
            }

            setupSampleImageRunButton((imageElement, outputOverlayCanvas) =>
                processImage(imageElement, outputOverlayCanvas, SAMPLE_IMAGE_SEARCH_REGION));
            setupVideoStreamRunButton(processImage);
        }
    </script>
</head>

<body>
    <div class="page page--wide">

        <header class="site-header">
            <a class="back-link" href="../">&larr; ailia.js Demo</a>
            <h1>FaceMesh-V2</h1>
            <p class="tagline">478 point face mesh running in your browser with WebAssembly.</p>
        </header>

        <p class="status-container">Checking the model files</p>

        <div class="controls">
            <button class="singleImageButton">Run with sample image</button>
            <button class="videoStreamButton">Run with camera</button>
        </div>

        <div class="io-container">
            <div class="input-container">
                <h2>Sample image (click to change)</h2>
                <img class="sample-image" src='../images/sample-image.jpg'></img>
            </div>
            <div class="output-container">
                <h2>Result</h2>
                <div class="result-container"></div>
                <p class="result-json"></p>
            </div>
        </div>

    </div>
</body>

</html>
