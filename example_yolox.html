<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />

    <style>
        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100%;
        }

        .io-container>* {
            max-width: 45vw;
            max-height: 500px;
        }

        .io-container>* img,
        .io-container>* video,
        .io-container>* canvas {
            max-width: 100%;
            ;
            max-height: 100%;
        }

        .result-container {
            position: relative;
        }

        .result-json {
            color: lightgrey;
        }

        .singleImageButton,
        .videoStreamButton {
            visibility: hidden;
        }

        .model-loaded .singleImageButton,
        .model-loaded .videoStreamButton {
            visibility: visible;
        }
    </style>

    <script type='module'>
        import { Ailia, AiliaDetector } from './ailia.js';
        import { getRatioToMaxSizeWithinFrame, setStatus, changeSampleImage, createAiliaWithModel, setupSampleImageRunButton, setupVideoStreamRunButton } from './demoUtils.js';

        function drawDetection(detection, context) {
            const featureSize = 10;

            const finalWidth = context.canvas.width;
            const finalHeight = context.canvas.height;
            const finalSquareLength = Math.max(finalWidth, finalHeight);
            const xOffset = (finalSquareLength - finalWidth) / 2;
            const yOffset = -(finalSquareLength - finalHeight) / 2;

            context.strokeStyle = 'red';
            context.lineWidth = featureSize / 2;
            context.strokeRect(
                finalSquareLength * detection.x + xOffset,
                finalSquareLength * detection.y + yOffset,
                finalSquareLength * detection.w,
                finalSquareLength * detection.h
            );

            context.fillStyle = 'red';
            context.lineWidth = 1;
            context.fillText(
                `${detection.categoryName} ${Math.round(detection.prob * 100)}%`,
                finalSquareLength * detection.x + xOffset + 8,
                finalSquareLength * detection.y + yOffset + 12
            );
        }

        function drawDetections(detections, context) {
            context.clearRect(0, 0, context.canvas.width, context.canvas.height);
            for (const detection of detections) {
                drawDetection(detection, context);
            }
        }

        export function plotDetections(canvas, detections, inputPic) {
            const ctx = canvas.getContext('2d');
            const featureSize = 10 * (Math.max(1, Math.floor(Math.max(canvas.width, canvas.height) / 512)));

            const finalWidth = canvas.width;
            const finalHeight = canvas.height;
            const finalSquareLength = Math.max(finalWidth, finalHeight);
            const xOffset = (finalSquareLength - finalWidth) / 2;
            const yOffset = -(finalSquareLength - finalHeight) / 2;

            if (inputPic) {
                ctx.drawImage(inputPic, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            for (const detection of detections) {
                ctx.strokeStyle = 'red';
                ctx.lineWidth = featureSize / 2;
                const topLeftX = finalSquareLength * detection.x + xOffset;
                const topLeftY = finalSquareLength * detection.y + yOffset;
                ctx.strokeRect(topLeftX, topLeftY, finalSquareLength * detection.w, finalSquareLength * detection.h);
                ctx.fillStyle = 'black';
                ctx.font = `${2 * featureSize}px serif`;
                ctx.strokeText(
                    `${detection.categoryName} ${Math.round(detection.prob * 100)}%`,
                    topLeftX + featureSize,
                    topLeftY + 2 * featureSize
                );
                ctx.fillText(
                    `${detection.categoryName} ${Math.round(detection.prob * 100)}%`,
                    topLeftX + featureSize,
                    topLeftY + 2 * featureSize
                );
            }
        }

        if (document.readyState === 'complete') { // Safari
            onload();
        }else{ // Chrome or Safari
            window.addEventListener('load', onload);
        }
        
        async function onload(){
            const imageContainerElement = document.querySelector('.sample-image');
            imageContainerElement.addEventListener('click', changeSampleImage.bind(null, imageContainerElement));

            await Ailia.initialize();
            const ailiaYoloX = await createAiliaWithModel('yolox', 'yolox_tiny');

            if (ailiaYoloX === null) {
                setStatus('Could not load the model files from the backend', 'error');
                return;
            }

            let detector = new AiliaDetector(ailiaYoloX, 'yolox');

            document.body.classList.add('model-loaded');
            setStatus('Model ready to run');

            const mycanvas = document.createElement('canvas');
            const context = mycanvas.getContext('2d');
            const myresult = document.querySelector('.result-json');

            function processImage(imageElement, outputOverlayCanvas) {
                try {
                    const modelImageInputSize = 300;
                    const minProbability = 0.75;

                    mycanvas.width = modelImageInputSize;
                    mycanvas.height = modelImageInputSize;

                    const imageWidth = imageElement.naturalWidth || imageElement.videoWidth;
                    const imageHeight = imageElement.naturalHeight || imageElement.videoHeight;

                    const ratio = getRatioToMaxSizeWithinFrame(
                        imageWidth,
                        imageHeight,
                        modelImageInputSize,
                        modelImageInputSize
                    );

                    const finalWidth = ratio * imageWidth;
                    const finalHeight = ratio * imageHeight;
                    const xOffset = (modelImageInputSize - finalWidth) / 2;
                    const yOffset = (modelImageInputSize - finalHeight) / 2;

                    context.fillStyle = '#000000';
                    context.fillRect(0, 0, mycanvas.width, mycanvas.height);
                    context.drawImage(imageElement, xOffset, yOffset, finalWidth, finalHeight);

                    var startTime = new Date();
                    let detectionResults = detector.compute(mycanvas, minProbability);
                    var endTime = new Date();
                    setStatus('The model has finished running ' + (endTime.getTime() - startTime.getTime()) + 'ms');

                    if (!detectionResults) {
                        return;
                    }

                    plotDetections(outputOverlayCanvas, detectionResults);

                    if (detectionResults && detectionResults.length > 0) {
                        myresult.innerText = JSON.stringify(detectionResults, null, 4);
                    } else {
                        myresult.innerText = '';
                    }
                } catch (e) {
                    console.log(e);
                    const message = detector.getErrorDetail();
                    console.error(message);
                    setStatus(`Error while running the model: ${message}`, 'error');
                }
            }

            setupSampleImageRunButton(processImage);
            setupVideoStreamRunButton(processImage);
        }
    </script>
</head>

<body style="background-color: #fff">
    <h1>YOLOX Tiny</h1>
    <p class="status-container">Checking the model files</p>
    <button class="singleImageButton"> Run with sample image</button>
    <button class="videoStreamButton"> Run with camera </button>
    <div class="io-container">
        <div class="input-container">
            <h2>Sample image (click to change)</h2>
            <img class="sample-image" src='sample-image.jpg'></img>
        </div>
        <div class="output-container">
            <h2>Result</h2>
            <div class="result-container"></div>
            <p class="result-json"></p>
        </div>
    </div>
</body>

</html>
