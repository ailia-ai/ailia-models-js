<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobileNet SSD | ailia.js Demo</title>
    <link rel="stylesheet" href="../style.css" />

    <script type='module'>
        import { Ailia, AiliaDetector } from '../ailia-js/ailia.js';
        import { getRatioToMaxSizeWithinFrame, setStatus, changeSampleImage, createAiliaWithModel, setupSampleImageRunButton, setupVideoStreamRunButton } from '../common/demoUtils.js';
        import { plotDetections } from '../common/detectionUtils.js';

        if (document.readyState === 'complete') { // Safari
            onload();
        }else{ // Chrome or Safari
            window.addEventListener('load', onload);
        }
        
        async function onload(){
            const imageContainerElement = document.querySelector('.sample-image');
            imageContainerElement.addEventListener('click', changeSampleImage.bind(null, imageContainerElement));

            await Ailia.initialize();
            const ailiaMobilenetSSD = await createAiliaWithModel('mobilenet_ssd', 'mb2-ssd-lite');

            if (ailiaMobilenetSSD === null) {
                setStatus('Could not load the model files from the backend', 'error');
                return;
            }

            let detector = new AiliaDetector(ailiaMobilenetSSD, 'mobilenetssd');

            document.body.classList.add('model-loaded');
            setStatus('Model ready to run');

            const mycanvas = document.createElement('canvas');
            const context = mycanvas.getContext('2d');
            const myresult = document.querySelector('.result-json');

            function processImage(imageElement, outputOverlayCanvas) {
                try {
                    const modelImageInputSize = 300;
                    const minProbability = 0.75;

                    mycanvas.width = modelImageInputSize;
                    mycanvas.height = modelImageInputSize;

                    const imageWidth = imageElement.naturalWidth || imageElement.videoWidth;
                    const imageHeight = imageElement.naturalHeight || imageElement.videoHeight;

                    const ratio = getRatioToMaxSizeWithinFrame(
                        imageWidth,
                        imageHeight,
                        modelImageInputSize,
                        modelImageInputSize
                    );

                    const finalWidth = ratio * imageWidth;
                    const finalHeight = ratio * imageHeight;
                    const xOffset = (modelImageInputSize - finalWidth) / 2;
                    const yOffset = (modelImageInputSize - finalHeight) / 2;

                    context.fillStyle = '#000000';
                    context.fillRect(0, 0, mycanvas.width, mycanvas.height);
                    context.drawImage(imageElement, xOffset, yOffset, finalWidth, finalHeight);

                    var startTime = new Date();
                    let detectionResults = detector.compute(mycanvas, minProbability);
                    var endTime = new Date();
                    setStatus('The model has finished running ' + (endTime.getTime() - startTime.getTime()) + 'ms');

                    if (!detectionResults) {
                        return;
                    }

                    plotDetections(outputOverlayCanvas, detectionResults);

                    if (detectionResults && detectionResults.length > 0) {
                        myresult.innerText = JSON.stringify(detectionResults, null, 4);
                    } else {
                        myresult.innerText = '';
                    }
                } catch (e) {
                    console.log(e);
                    const message = detector.getErrorDetail();
                    console.error(message);
                    setStatus(`Error while running the model: ${message}`, 'error');
                }
            }

            setupSampleImageRunButton(processImage);
            setupVideoStreamRunButton(processImage);
        }
    </script>
</head>

<body>
    <div class="page page--wide">

        <header class="site-header">
            <a class="back-link" href="../">&larr; ailia.js Demo</a>
            <h1>MobileNet SSD</h1>
            <p class="tagline">Object detection running in your browser with WebAssembly.</p>
        </header>

        <p class="status-container">Checking the model files</p>

        <div class="controls">
            <button class="singleImageButton">Run with sample image</button>
            <button class="videoStreamButton">Run with camera</button>
        </div>

        <div class="io-container">
            <div class="input-container">
                <h2>Sample image (click to change)</h2>
                <img class="sample-image" src='../images/sample-image.jpg'></img>
            </div>
            <div class="output-container">
                <h2>Result</h2>
                <div class="result-container"></div>
                <p class="result-json"></p>
            </div>
        </div>

    </div>
</body>

</html>
